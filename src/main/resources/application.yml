server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: anurag-alumni-connect

  datasource:
    url: jdbc:mysql://localhost:3306/anurag_alumni_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: AnuragHikariCP

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Application specific JWT configurations
app:
  jwt:
    secret: 9a4f2c8d7e1b5a3c6f8e0d2b4a6c8e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c3d
    expiration-ms: 900000         # 15 minutes
    refresh-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173"
